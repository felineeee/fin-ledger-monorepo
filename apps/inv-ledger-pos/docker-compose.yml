version: '3.8'

services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: inv-ledger_postgres_dev
    environment:
      POSTGRES_USER: c_log
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: inv-ledger_db_dev
    ports:
      - '5433:5432'
    volumes:
      - pg_dev_data:/var/lib/postgresql/data

  redis_dev:
    image: redis:7-alpine
    container_name: inv-ledger_redis_dev
    ports:
      - '6380:6379'
    volumes:
      - redis_dev_data:/data

volumes:
  pg_dev_data:
  redis_dev_data:
